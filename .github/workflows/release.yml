# 发版：推一个 v 开头的标签（比如 v0.4.0，要和 package.json 的版本一致），在 Windows 上跑测试、打包，
# 把安装包和 latest.yml 传到 GitHub Releases 的一份草稿里。在网页上看过没问题再点发布；发布之后，
# 装了旧版的人才会收到自动更新（草稿对自动更新不可见）。
# 改了发布流程或打包配置的推送、以及在 Actions 页面手动运行（Run workflow），都只打包：
# 安装包放在这次运行的 Artifacts 里，不碰 Releases。
name: Release

on:
  push:
    tags: ['v*']
    branches: ['**']
    # 只对分支推送生效（推标签时 GitHub 不看 paths）
    paths:
      - .github/workflows/release.yml
      - electron-builder.config.js
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::标签 $GITHUB_REF_NAME 和 package.json 的版本 $v 不一致"
            exit 1
          fi
      - run: npm run build:icon
      - name: Build and upload to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder --config electron-builder.config.js --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build only
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --config electron-builder.config.js --win --publish never
      - uses: actions/upload-artifact@v5
        with:
          name: installer
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
